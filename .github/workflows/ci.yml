name: validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md
        run: |
          python3 -c "
          import re, sys

          with open('SKILL.md') as f:
              content = f.read()

          # Frontmatter start
          if not content.startswith('---'):
              print('SKILL.md must start with ---')
              sys.exit(1)

          # Required fields
          ok = True
          for field in ['name: project-excellence', 'version:', 'description:', 'author:', 'license:']:
              if field not in content:
                  print(f'Missing: {field}')
                  ok = False
          if not ok:
              sys.exit(1)

          # Referenced files exist
          refs = set(re.findall(r'references/[\w./-]+\.md', content))
          for r in sorted(refs):
              try:
                  open(r).close()
                  print(f'  OK {r}')
              except FileNotFoundError:
                  print(f'BROKEN {r}')
                  sys.exit(1)
          print(f'OK: references ({len(refs)} files)')

          # Relative links work
          links = re.findall(r'\(references/[^)]+\)', content)
          for l in links:
              t = l.strip('()')
              try:
                  open(t).close()
              except FileNotFoundError:
                  print(f'BROKEN {t}')
                  sys.exit(1)
          print(f'OK: links ({len(links)} valid)')
          print('ALL PASSED')
          "

      - name: Lint markdown files
        run: |
          which npx >/dev/null 2>&1 || { echo "No npx, skip lint"; exit 0; }
          npx --yes markdownlint-cli2@latest --no-config \
            '*.md' 'references/**/*.md' 'templates/**/*.md' 2>&1 || true
          echo "Lint done"